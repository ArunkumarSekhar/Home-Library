<title>Home Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: three tabs. Library shows one sideways-scrolling row of covers per genre (or a dense
   cover wall), so 235 books fit in a few screens. Tapping a cover opens its record card. */
:root {
  --paper: #eef0ec;         /* page ground: cool grey-green, like painted shelf boards */
  --card: #fbfcf9;          /* raised surfaces */
  --ink: #1d2a2e;           /* main text */
  --ink-soft: #5b676a;      /* secondary text */
  --rule: #d5dad3;          /* hairlines */
  --accent: #b5651d;        /* marigold-rust: actions, selection, focus */
  --accent-ink: #ffffff;
  --read: #3d7a55;          /* status colours (semantic, separate from accent) */
  --reading: #b8860b;
  --unread: #a3acae;
  --cov-s: 30%;             /* generated covers: hue comes from the genre */
  --cov-l: 36%;
  --cov-ink: #f7f4ec;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 6px;
  --tile: 116px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151b1d; --card: #1e2629; --ink: #e6ebe7; --ink-soft: #9aa6a8; --rule: #2f3a3d;
    --accent: #e0954f; --accent-ink: #1a1208;
    --read: #6fbf8b; --reading: #e2b44a; --unread: #56636a;
    --cov-s: 28%; --cov-l: 30%; --cov-ink: #f1ede4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151b1d; --card: #1e2629; --ink: #e6ebe7; --ink-soft: #9aa6a8; --rule: #2f3a3d;
  --accent: #e0954f; --accent-ink: #1a1208;
  --read: #6fbf8b; --reading: #e2b44a; --unread: #56636a;
  --cov-s: 28%; --cov-l: 30%; --cov-ink: #f1ede4;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
.wrap > *, #books { min-width: 0; }
.view { display: grid; gap: 14px; min-width: 0; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--ui); -webkit-text-size-adjust: 100%; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 32px); padding-block: 22px 64px; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: .02em; }
.hint { font-size: 13px; color: var(--ink-soft); margin: 0; }

/* Header + tabs */
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 24px; }
header h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.05; }
header p { margin: 4px 0 0; color: var(--ink-soft); font-size: 14px; }
.save-mode { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
.save-mode i { width: 8px; height: 8px; border-radius: 50%; background: var(--unread); }
.save-mode[data-mode="cloud"] i { background: var(--read); }
.save-mode[data-mode="local"] i { background: var(--reading); }
nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); overflow-x: auto; }
nav.tabs button { border: 0; background: none; padding: 10px 14px; font-size: 15px; color: var(--ink-soft); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs .count { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); margin-left: 6px; }

/* Controls */
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { flex: 1 1 240px; min-width: 0; position: relative; }
.search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--card); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--ink-soft); fill: none; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--card); overflow: hidden; max-width: 100%; }
.seg button { border: 0; background: none; padding: 8px 11px; font-size: 14px; color: var(--ink-soft); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
select { padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--card); max-width: 100%; }
.shelf-chips { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.shelf-chips .label { margin-right: 4px; }
.chip { border: 1px solid var(--rule); background: var(--card); border-radius: 4px; min-width: 32px; height: 32px; padding: 0 8px; font-family: var(--mono); font-size: 13px; color: var(--ink-soft); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.result-line { font-size: 13px; color: var(--ink-soft); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; min-height: 20px; }
.linkish { border: 0; background: none; color: var(--accent); padding: 0; font-size: 13px; }

/* Covers */
.tile { display: grid; gap: 6px; align-content: start; text-align: left; border: 0; background: none; padding: 0; width: var(--tile); min-width: 0; }
.cover { display: block; position: relative; aspect-ratio: 2 / 3; width: 100%; max-width: 100%; border-radius: 3px 5px 5px 3px; overflow: hidden; background: hsl(var(--h) var(--cov-s) var(--cov-l)); color: var(--cov-ink); box-shadow: inset 4px 0 0 rgb(0 0 0 / .18); transition: transform .12s ease; }
.tile:hover .cover { transform: translateY(-2px); }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover .gen { position: absolute; inset: 0; padding: 22px 10px 10px 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
.cover .gen b { font-family: var(--display); font-weight: 400; font-size: 13px; line-height: 1.25; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.cover .gen small { font-size: 10px; opacity: .85; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.shelf-tag { position: absolute; top: 5px; left: 8px; font-family: var(--mono); font-size: 10px; padding: 1px 5px; border-radius: 3px; background: rgb(0 0 0 / .45); color: #fff; z-index: 1; }
.dot { position: absolute; top: 6px; right: 6px; width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px rgb(255 255 255 / .85); z-index: 1; }
.dot[data-s="read"] { background: var(--read); } .dot[data-s="reading"] { background: var(--reading); } .dot[data-s="unread"] { display: none; }
.tile-art { position: relative; display: block; }
.tile .t { font-size: 13px; line-height: 1.3; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.tile .a { font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Genre overview */
.genres { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.genre-card { display: grid; grid-template-columns: 92px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 12px; align-content: center; text-align: left; background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px; min-height: 104px; }
.genre-card:hover { border-color: var(--ink-soft); }
.genre-card .fan { grid-row: 1 / 3; position: relative; height: 78px; }
.fan-item { position: absolute; top: 0; left: calc(var(--i) * 15px); width: 46px; transform: rotate(calc((var(--i) - 1.5) * 4deg)); box-shadow: 0 1px 3px rgb(0 0 0 / .25); border-radius: 3px; }
.fan-item .cover .gen { padding: 6px 4px; } .fan-item .cover .gen b { font-size: 7px; } .fan-item .cover .gen small { display: none; }
.g-name { font-family: var(--display); font-size: 17px; line-height: 1.2; align-self: end; }
.g-meta { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; align-self: start; margin-top: 4px; }
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile), 1fr)); gap: 18px 14px; }
.wall .tile { width: 100%; }
.empty { padding: 36px 16px; text-align: center; color: var(--ink-soft); border: 1px dashed var(--rule); border-radius: var(--radius); }

/* Lines & ideas */
.notebook { display: grid; gap: 14px; max-width: 760px; }
.entry { background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--c); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; }
.entry[data-kind="line"] { --c: hsl(190 30% 38%); } .entry[data-kind="idea"] { --c: var(--accent); }
.entry blockquote { margin: 0; font-family: var(--display); font-size: 17px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.entry[data-kind="idea"] blockquote { font-family: var(--ui); font-size: 15px; }
.entry .src { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--ink-soft); align-items: baseline; }
.entry .src button { border: 0; background: none; padding: 0; color: var(--ink); font-weight: 600; text-align: left; }
.entry .src button:hover { color: var(--accent); }
.kind { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--c); }

/* Stats */
.stats { display: grid; gap: 18px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel h3 { font-size: 18px; }
.panel.wide { grid-column: 1 / -1; }
.totals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.totals b { display: block; font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hbars { display: grid; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 52px; gap: 10px; align-items: center; font-size: 13px; }
.hbar > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.track { display: flex; gap: 2px; height: 10px; }
.track span { height: 100%; border-radius: 2px; min-width: 0; }
.track .r { background: var(--read); } .track .g { background: var(--reading); } .track .u { background: var(--unread); opacity: .45; }
.track .v { background: var(--accent); border-radius: 0 4px 4px 0; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-soft); }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--c); }
.months { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; align-items: end; height: 140px; padding-top: 16px; border-bottom: 1px solid var(--rule); }
.months div { position: relative; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 0; }
.months div span { position: absolute; top: -17px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.month-labels { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; font-size: 11px; color: var(--ink-soft); text-align: center; }

/* Record card */
dialog { width: min(680px, calc(100vw - 24px)); max-height: calc(100dvh - 32px); padding: 0; border: 1px solid var(--rule); border-radius: 10px; background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgb(10 15 17 / .5); }
.rec { display: grid; gap: 20px; padding: 20px clamp(16px, 4vw, 26px) 26px; }
.rec-head { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.rec-head .cover { width: 84px; }
.rec-head h2 { font-size: 24px; line-height: 1.15; }
.rec-head p { margin: 4px 0 0; color: var(--ink-soft); }
.where { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: var(--ink-soft); align-items: center; }
.where select { padding: 4px 8px; font-size: 13px; }
.close { border: 1px solid var(--rule); background: none; border-radius: 50%; width: 34px; height: 34px; font-size: 18px; line-height: 1; }
.block { display: grid; gap: 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 6px 12px; font-size: 14px; color: var(--ink); }
.opt[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.dates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field input[type="date"] { padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); width: 100%; }
.notes { display: grid; gap: 10px; }
.notes h3 { font-size: 19px; }
.note { border-left: 3px solid var(--c); padding: 4px 0 4px 12px; display: grid; gap: 4px; }
.note[data-kind="line"] { --c: hsl(190 30% 38%); } .note[data-kind="idea"] { --c: var(--accent); }
.note blockquote { margin: 0; font-family: var(--display); font-size: 16px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.note[data-kind="idea"] blockquote { font-family: var(--ui); font-size: 15px; }
.note .foot { display: flex; gap: 12px; font-size: 12px; color: var(--ink-soft); align-items: center; }
.note .foot button { border: 0; background: none; color: var(--ink-soft); padding: 0; font-size: 12px; text-decoration: underline; }
.note .foot button.armed { color: var(--accent); font-weight: 600; }
.add { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); }
.add textarea { width: 100%; min-height: 80px; padding: 10px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--card); resize: vertical; }
.add-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.add-row input { width: 86px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--card); }
.primary { border: 0; background: var(--accent); color: var(--accent-ink); padding: 9px 16px; border-radius: var(--radius); font-weight: 600; margin-left: auto; }
.primary:disabled { opacity: .45; cursor: default; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: var(--radius); font-size: 14px; max-width: calc(100vw - 32px); z-index: 10; }

@media (max-width: 760px) {
  .stats { grid-template-columns: minmax(0, 1fr); }
  .totals { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hbar { grid-template-columns: minmax(0, 110px) minmax(0, 1fr) 44px; }
}
@media (max-width: 480px) {
  :root { --tile: 100px; }
  .rec-head { grid-template-columns: 64px minmax(0, 1fr) auto; }
  .rec-head .cover { width: 64px; }
  .dates { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .cover { transition: none; } .tile:hover .cover { transform: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Home Library</h1>
      <p id="subtitle">Loading your shelves…</p>
    </div>
    <span class="save-mode" id="saveMode" data-mode="starting"><i></i><span>Connecting…</span></span>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="library" aria-selected="true">Library</button>
    <button role="tab" data-tab="notebook" aria-selected="false">Lines &amp; ideas<span class="count" id="noteCount"></span></button>
    <button role="tab" data-tab="stats" aria-selected="false">Stats</button>
  </nav>

  <!-- Library -->
  <section id="view-library" class="view">
    <div class="controls">
      <label class="search">
        <svg viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="q" type="search" placeholder="Search title, author or your notes" autocomplete="off" aria-label="Search">
      </label>
      <select id="genre" aria-label="Genre"></select>
      <div class="seg" id="statusFilter" role="group" aria-label="Reading status">
        <button data-v="all" aria-pressed="true">All</button>
        <button data-v="unread" aria-pressed="false">Not yet</button>
        <button data-v="reading" aria-pressed="false">Reading</button>
        <button data-v="read" aria-pressed="false">Read</button>
      </div>
    </div>
    <div class="controls">
      <div class="shelf-chips" id="shelfChips"></div>
      <div class="seg" id="viewToggle" role="group" aria-label="Layout" style="margin-left:auto">
        <button data-v="genres" aria-pressed="true">By genre</button>
        <button data-v="wall" aria-pressed="false">All covers</button>
      </div>
    </div>
    <div class="result-line" id="resultLine"></div>
    <div id="books"></div>
  </section>

  <!-- Lines & ideas -->
  <section id="view-notebook" hidden>
    <div class="view">
      <div class="controls">
        <label class="search">
          <svg viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="nq" type="search" placeholder="Search your lines and ideas" autocomplete="off" aria-label="Search lines and ideas">
        </label>
        <div class="seg" id="kindFilter" role="group" aria-label="Kind">
          <button data-v="all" aria-pressed="true">All</button>
          <button data-v="line" aria-pressed="false">Lines</button>
          <button data-v="idea" aria-pressed="false">Ideas</button>
        </div>
      </div>
      <div class="notebook" id="notebook"></div>
    </div>
  </section>

  <!-- Stats -->
  <section id="view-stats" hidden>
    <div class="stats" id="stats"></div>
  </section>
</div>

<script src="books.js"></script>
<script>
// ---------------------------------------------------------------------------
// Home Library app.
// books.js holds the catalogue (what you own). This file shows it and keeps
// your reading record for each book.
// ---------------------------------------------------------------------------

const BOOKS = window.BOOKS || [];
const SHELVES = window.SHELVES || {};
const GENRES = window.GENRES || [];
const STATUS_LABEL = { unread: "Not yet", reading: "Reading", read: "Read" };

// The rating system: a verdict, what the book gave you, and whether you'd read it again.
const VERDICTS = ["Changed me", "Loved it", "Glad I read it", "Mixed feelings", "Not for me", "Didn’t finish"];
const GAVE = ["Ideas", "A story", "Beautiful language", "Laughs", "Comfort", "Knowledge", "A new perspective", "Craft to learn from", "Nostalgia"];
const REREAD = ["Yes", "Maybe", "No"];

BOOKS.forEach((b, i) => { b.order = i; });

// Your reading record, keyed by book id.
let reading = {};
const ui = { tab: "library", q: "", genre: "all", shelf: "all", status: "all", view: "genres", nq: "", kind: "all", openId: null };

// ---------------------------------------------------------------------------
// Saving. Inside Claude, records save to your account, so the iPad and the
// laptop see the same data. Opened as a plain file, they save in this browser.
// ---------------------------------------------------------------------------
const LOCAL_KEY = "home-library:reading";
const Store = {
  db: null, pending: {}, busy: {},

  async start() {
    if (!window.claude || !window.claude.use) return this.useLocal();
    let db = null;
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) return this.useLocal();
    this.db = db;
    this.setMode("cloud");
    db.collection("reading").onSnapshot(
      snap => {
        const next = {};
        snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
        reading = next;
        render();
      },
      () => { this.useLocal(); toast("Lost the connection to your account. Changes now save on this device."); }
    );
  },

  useLocal() {
    this.db = null;
    try { reading = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"); } catch (e) { reading = {}; }
    this.setMode("local");
    render();
  },

  setMode(mode) {
    const el = $("saveMode");
    el.dataset.mode = mode;
    el.lastElementChild.textContent = mode === "cloud" ? "Saved to your account" : "Saved on this device";
  },

  save(id) {
    if (this.db) { this.pending[id] = true; this.flush(id); return; }
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(reading)); }
    catch (e) { toast("This browser isn’t letting the page save. Your change will be lost on reload."); }
  },

  // One write at a time per book; a change made mid-write is sent right after.
  async flush(id) {
    if (this.busy[id]) return;
    this.busy[id] = true;
    while (this.pending[id]) {
      this.pending[id] = false;
      try { await this.db.collection("reading").doc(id).set(reading[id]); }
      catch (e) { toast(e && e.code === "quota_exceeded" ? "Your library storage is full." : "Couldn’t save that change. Try again in a moment."); }
    }
    this.busy[id] = false;
  }
};

function recordOf(id) {
  const r = reading[id];
  const base = { status: "unread", verdict: "", gave: [], reread: "", started: "", finished: "", notes: [] };
  return r ? Object.assign(base, JSON.parse(JSON.stringify(r))) : base;
}
function update(id, change) {
  const r = recordOf(id);
  change(r);
  r.updatedAt = new Date().toISOString();
  reading = { ...reading, [id]: r };
  Store.save(id);
  render();
}
const statusOf = id => (reading[id] && reading[id].status) || "unread";
const genreOf = b => (reading[b.id] && reading[b.id].genre) || b.genre || "Reference & Other";
const notesOf = id => (reading[id] && reading[id].notes) || [];

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);

function render() {
  const total = BOOKS.length;
  const notes = BOOKS.reduce((n, b) => n + notesOf(b.id).length, 0);
  $("subtitle").textContent = `${total} books · ${GENRES.length} genres · ${Object.keys(SHELVES).length} shelves`;
  $("noteCount").textContent = notes || "";
  if (ui.tab === "library") renderLibrary();
  if (ui.tab === "notebook") renderNotebook();
  if (ui.tab === "stats") renderStats();
  if (ui.openId) renderRecord(ui.openId);
}

function genreHue(g) { return Math.round((Math.max(0, GENRES.indexOf(g)) * 360 / Math.max(1, GENRES.length) + 18) % 360); }

function coverHTML(b) {
  const img = b.cover ? `<img src="covers/${b.id}.jpg" alt="" loading="lazy">` : "";
  return `<span class="cover" style="--h:${genreHue(genreOf(b))}">
    <span class="gen" aria-hidden="true"><b>${esc(b.title)}</b><small>${esc(b.author)}</small></span>${img}
  </span>`;
}

function tileHTML(b) {
  const s = statusOf(b.id);
  return `<button class="tile" data-id="${b.id}" title="${esc(b.title)} · Shelf ${b.shelf}">
    <span class="tile-art">
      ${coverHTML(b)}
      <span class="shelf-tag">${b.shelf}</span>
      <span class="dot" data-s="${s}" aria-label="${STATUS_LABEL[s]}"></span>
    </span>
    <span class="t">${esc(b.title)}</span>
    <span class="a">${esc(b.author || "Author unknown")}</span>
  </button>`;
}

function matches(b) {
  if (ui.genre !== "all" && genreOf(b) !== ui.genre) return false;
  if (ui.shelf !== "all" && b.shelf !== ui.shelf) return false;
  if (ui.status !== "all" && statusOf(b.id) !== ui.status) return false;
  if (!ui.q) return true;
  const hay = [b.title, b.author, genreOf(b), ...notesOf(b.id).map(n => n.text)].join(" ").toLowerCase();
  return ui.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
const byTitle = (a, b) => a.title.localeCompare(b.title);

function renderLibrary() {
  // Filters
  const gSel = $("genre");
  gSel.innerHTML = `<option value="all">All genres</option>` +
    GENRES.map(g => `<option value="${esc(g)}" ${ui.genre === g ? "selected" : ""}>${esc(g)} (${BOOKS.filter(b => genreOf(b) === g).length})</option>`).join("");
  $("shelfChips").innerHTML = `<span class="label">Shelf</span>` +
    [["all", "All"], ...Object.keys(SHELVES).map(k => [k, k])].map(([k, t]) =>
      `<button class="chip" data-shelf="${k}" aria-pressed="${ui.shelf === k}" title="${esc(k === "all" ? "All shelves" : SHELVES[k])}">${t}</button>`).join("");

  const list = BOOKS.filter(matches).sort(byTitle);
  const filters = [];
  if (ui.genre !== "all") filters.push(ui.genre);
  if (ui.shelf !== "all") filters.push("Shelf " + ui.shelf + " (" + SHELVES[ui.shelf] + ")");
  if (ui.status !== "all") filters.push(STATUS_LABEL[ui.status]);
  if (ui.q) filters.push("“" + ui.q + "”");
  $("resultLine").innerHTML = `<span>${list.length} of ${BOOKS.length} books${filters.length ? " · " + esc(filters.join(" · ")) : ""}</span>` +
    (ui.genre !== "all" && ui.view === "genres" ? `<button class="linkish" id="backGenres">← All genres</button>` : "") +
    (filters.length ? `<button class="linkish" id="clear">Clear filters</button>` : "");

  const out = $("books");
  if (!list.length) { out.innerHTML = `<div class="empty">No books match. Try another word, or clear the filters.</div>`; return; }

  // The genre overview fits on one screen; a genre, a search or "All covers" shows a wall of covers.
  if (ui.view === "wall" || ui.genre !== "all" || ui.q) {
    out.innerHTML = `<div class="wall">${list.map(tileHTML).join("")}</div>`;
    return;
  }
  out.innerHTML = `<div class="genres">${GENRES.map(g => {
    const inG = list.filter(b => genreOf(b) === g);
    if (!inG.length) return "";
    const read = inG.filter(b => statusOf(b.id) === "read").length;
    const fan = inG.slice(0, 4).map((b, i) => `<span class="fan-item" style="--i:${i}">${coverHTML(b)}</span>`).join("");
    return `<button class="genre-card" data-see="${esc(g)}">
      <span class="fan" aria-hidden="true">${fan}</span>
      <span class="g-name">${esc(g)}</span>
      <span class="g-meta">${inG.length} ${inG.length === 1 ? "book" : "books"}${read ? ` · ${read} read` : ""}</span>
    </button>`;
  }).join("")}</div>`;
}

function renderNotebook() {
  const all = [];
  BOOKS.forEach(b => notesOf(b.id).forEach(n => all.push({ ...n, book: b })));
  all.sort((a, b) => (b.at || "").localeCompare(a.at || ""));
  const words = ui.nq.toLowerCase().split(/\s+/).filter(Boolean);
  const shown = all.filter(n =>
    (ui.kind === "all" || n.kind === ui.kind) &&
    words.every(w => (n.text + " " + n.book.title + " " + n.book.author).toLowerCase().includes(w)));

  if (!all.length) {
    $("notebook").innerHTML = `<div class="empty">Your lines and ideas will collect here.<br>Open any book in the Library and save a line you loved or an idea it gave you.</div>`;
    return;
  }
  $("notebook").innerHTML = `<p class="hint">${shown.length} of ${all.length}</p>` + (shown.length ? shown.map(n => `
    <article class="entry" data-kind="${n.kind}">
      <span class="kind">${n.kind === "line" ? "Line" : "Idea"}</span>
      <blockquote>${esc(n.text)}</blockquote>
      <div class="src"><button data-id="${n.book.id}">${esc(n.book.title)}</button>
        <span>${esc(n.book.author)}</span>${n.page ? `<span>p. ${esc(n.page)}</span>` : ""}<span>${fmtDate(n.at)}</span></div>
    </article>`).join("") : `<div class="empty">Nothing matches that search.</div>`);
}

function renderStats() {
  const year = new Date().getFullYear();
  const count = s => BOOKS.filter(b => statusOf(b.id) === s).length;
  const readThisYear = BOOKS.filter(b => statusOf(b.id) === "read" && (reading[b.id].finished || "").startsWith(String(year)));
  const notes = BOOKS.reduce((n, b) => n + notesOf(b.id).length, 0);

  const statusBars = (groups) => `<div class="hbars">${groups.map(([name, books]) => {
    const r = books.filter(b => statusOf(b.id) === "read").length;
    const g = books.filter(b => statusOf(b.id) === "reading").length;
    const u = books.length - r - g;
    return `<div class="hbar" title="${esc(name)}: ${r} read, ${g} reading, ${u} not yet">
      <span>${esc(name)}</span>
      <span class="track">${r ? `<span class="r" style="flex:${r}"></span>` : ""}${g ? `<span class="g" style="flex:${g}"></span>` : ""}${u ? `<span class="u" style="flex:${u}"></span>` : ""}</span>
      <span class="num">${r}/${books.length}</span></div>`;
  }).join("")}</div>`;
  const legend = `<div class="legend"><span style="--c:var(--read)">Read</span><span style="--c:var(--reading)">Reading</span><span style="--c:var(--unread)">Not yet</span></div>`;

  const months = Array.from({ length: 12 }, (_, m) =>
    readThisYear.filter(b => Number((reading[b.id].finished || "").slice(5, 7)) === m + 1).length);
  const maxM = Math.max(1, ...months);

  const verdicts = VERDICTS.map(v => [v, BOOKS.filter(b => reading[b.id] && reading[b.id].verdict === v).length]);
  const gave = GAVE.map(v => [v, BOOKS.filter(b => reading[b.id] && (reading[b.id].gave || []).includes(v)).length]).sort((a, b) => b[1] - a[1]);
  const valueBars = rows => {
    const max = Math.max(1, ...rows.map(r => r[1]));
    return `<div class="hbars">${rows.map(([k, n]) => `<div class="hbar" title="${esc(k)}: ${n}"><span>${esc(k)}</span>
      <span class="track">${n ? `<span class="v" style="width:${n / max * 100}%"></span>` : ""}</span><span class="num">${n}</span></div>`).join("")}</div>`;
  };
  const anyRated = verdicts.some(v => v[1]);

  $("stats").innerHTML = `
    <div class="panel wide"><div class="totals">
      <div><b>${count("read")}</b><span class="label">Read</span></div>
      <div><b>${count("reading")}</b><span class="label">Reading now</span></div>
      <div><b>${readThisYear.length}</b><span class="label">Finished in ${year}</span></div>
      <div><b>${notes}</b><span class="label">Lines &amp; ideas</span></div>
    </div></div>
    <div class="panel"><h3>By genre</h3>${legend}${statusBars(GENRES.map(g => [g, BOOKS.filter(b => genreOf(b) === g)]))}</div>
    <div class="panel"><h3>Finished each month, ${year}</h3>
      <div class="months">${months.map((n, i) => `<div style="height:${n / maxM * 100}%" title="${monthName(i)}: ${n}">${n ? `<span>${n}</span>` : ""}</div>`).join("")}</div>
      <div class="month-labels">${months.map((_, i) => `<span>${monthName(i).slice(0, 1)}</span>`).join("")}</div>
      ${readThisYear.length ? "" : `<p class="hint">Mark a book as Read and its finish date lands here.</p>`}
      <h3 style="margin-top:8px">By shelf</h3>${statusBars(Object.entries(SHELVES).map(([k, name]) => ["Shelf " + k + " · " + name, BOOKS.filter(b => b.shelf === k)]))}
    </div>
    <div class="panel"><h3>Verdicts</h3>${anyRated ? valueBars(verdicts) : `<p class="hint">Give a book a verdict in its record card to see the spread here.</p>`}</div>
    <div class="panel"><h3>What your books gave you</h3>${gave.some(g => g[1]) ? valueBars(gave) : `<p class="hint">Tick what each book gave you, and the pattern shows up here.</p>`}</div>`;
}

function renderRecord(id) {
  const b = BOOKS.find(x => x.id === id);
  if (!b) return;
  const r = recordOf(id);
  const dlg = $("dlg");
  // Keep whatever is typed in the "add" box across re-renders.
  const draft = dlg.querySelector("#noteText") ? {
    text: $("noteText").value, page: $("notePage").value,
    kind: dlg.querySelector("#noteKind [aria-pressed=true]")?.dataset.v
  } : null;
  const opts = (group, values, isOn) => `<div class="opts" data-group="${group}">${values.map(v =>
    `<button class="opt" data-v="${esc(v)}" aria-pressed="${isOn(v)}">${esc(v)}</button>`).join("")}</div>`;

  dlg.innerHTML = `<div class="rec">
    <div class="rec-head">
      ${coverHTML(b)}
      <div>
        <h2 id="recTitle">${esc(b.title)}</h2>
        <p>${esc(b.author || "Author unknown")}${b.language ? " · " + esc(b.language) : ""}</p>
        <div class="where">
          <span><span class="label">Shelf ${b.shelf}</span> · ${esc(SHELVES[b.shelf] || "")}</span>
          <label><span class="label">Genre</span>
            <select id="recGenre">${GENRES.map(g => `<option ${genreOf(b) === g ? "selected" : ""}>${esc(g)}</option>`).join("")}</select></label>
        </div>
        ${b.needsCheck ? `<p class="hint" style="margin-top:8px">The title or author is a best guess from the photo.</p>` : ""}
      </div>
      <button class="close" id="close" aria-label="Close">×</button>
    </div>

    <div class="block"><span class="label">Status</span>
      ${opts("status", ["unread", "reading", "read"].map(s => STATUS_LABEL[s]), v => STATUS_LABEL[r.status] === v)}</div>
    <div class="block"><span class="label">Verdict</span>
      ${opts("verdict", VERDICTS, v => r.verdict === v)}</div>
    <div class="block"><span class="label">What it gave me</span>
      ${opts("gave", GAVE, v => (r.gave || []).includes(v))}</div>
    <div class="block"><span class="label">Would I read it again?</span>
      ${opts("reread", REREAD, v => r.reread === v)}</div>
    <div class="dates">
      <label class="field"><span class="label">Started</span><input type="date" id="recStarted" value="${esc(r.started || "")}"></label>
      <label class="field"><span class="label">Finished</span><input type="date" id="recFinished" value="${esc(r.finished || "")}"></label>
    </div>

    <div class="notes">
      <h3>Lines &amp; ideas</h3>
      ${r.notes.length ? r.notes.map(n => `
        <div class="note" data-kind="${n.kind}">
          <blockquote>${esc(n.text)}</blockquote>
          <div class="foot"><span>${n.kind === "line" ? "Line" : "Idea"}${n.page ? " · p. " + esc(n.page) : ""} · ${fmtDate(n.at)}</span>
            <button data-del="${n.id}">Delete</button></div>
        </div>`).join("") : `<p class="hint">Nothing saved yet. Add a line you loved or an idea the book gave you.</p>`}
      <div class="add">
        <textarea id="noteText" placeholder="Type or paste a line from the book, or write down an idea"></textarea>
        <div class="add-row">
          <div class="seg" id="noteKind" role="group" aria-label="Kind">
            <button data-v="line" aria-pressed="true">Line</button>
            <button data-v="idea" aria-pressed="false">Idea</button>
          </div>
          <input id="notePage" inputmode="numeric" placeholder="Page" aria-label="Page number">
          <button class="primary" id="addNote" disabled>Save</button>
        </div>
      </div>
    </div>
  </div>`;

  if (draft) {
    $("noteText").value = draft.text; $("notePage").value = draft.page;
    setKind(draft.kind || "line");
    $("addNote").disabled = !draft.text.trim();
  }
}

function setKind(kind) {
  document.querySelectorAll("#noteKind button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === kind)));
}
function openRecord(id) {
  ui.openId = id;
  const dlg = $("dlg");
  dlg.innerHTML = "";
  renderRecord(id);
  if (!dlg.open) dlg.showModal();
}
function pressOne(groupEl, value) {
  groupEl.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === value)));
}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------
document.querySelector("nav.tabs").addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"); if (!t) return;
  ui.tab = t.dataset.tab;
  document.querySelectorAll("nav.tabs [data-tab]").forEach(x => x.setAttribute("aria-selected", String(x === t)));
  ["library", "notebook", "stats"].forEach(v => { $("view-" + v).hidden = v !== ui.tab; });
  render();
});
$("q").addEventListener("input", e => { ui.q = e.target.value.trim(); renderLibrary(); });
$("genre").addEventListener("change", e => { ui.genre = e.target.value; renderLibrary(); });
$("statusFilter").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  ui.status = btn.dataset.v; pressOne($("statusFilter"), ui.status); renderLibrary();
});
$("viewToggle").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  ui.view = btn.dataset.v; pressOne($("viewToggle"), ui.view); renderLibrary();
});
$("shelfChips").addEventListener("click", e => {
  const c = e.target.closest("[data-shelf]"); if (!c) return;
  ui.shelf = c.dataset.shelf; renderLibrary();
});
$("view-library").addEventListener("click", e => {
  if (e.target.id === "clear") {
    Object.assign(ui, { q: "", genre: "all", shelf: "all", status: "all" });
    $("q").value = ""; pressOne($("statusFilter"), "all"); renderLibrary(); return;
  }
  if (e.target.id === "backGenres") { ui.genre = "all"; renderLibrary(); return; }
  const see = e.target.closest("[data-see]");
  if (see) { ui.genre = see.dataset.see; renderLibrary(); window.scrollTo({ top: 0 }); return; }
  const tile = e.target.closest(".tile"); if (tile) openRecord(tile.dataset.id);
});
$("nq").addEventListener("input", e => { ui.nq = e.target.value.trim(); renderNotebook(); });
$("kindFilter").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  ui.kind = btn.dataset.v; pressOne($("kindFilter"), ui.kind); renderNotebook();
});
$("notebook").addEventListener("click", e => {
  const b = e.target.closest("[data-id]"); if (b) openRecord(b.dataset.id);
});

const dlg = $("dlg");
dlg.addEventListener("close", () => { ui.openId = null; });
dlg.addEventListener("click", e => {
  if (e.target === dlg) return dlg.close();           // tap outside the card
  const id = ui.openId; if (!id) return;
  const t = e.target;
  if (t.closest("#close")) return dlg.close();

  const opt = t.closest(".opt");
  if (opt) {
    const group = opt.parentElement.dataset.group, v = opt.dataset.v;
    const today = new Date().toISOString().slice(0, 10);
    return update(id, r => {
      if (group === "status") {
        r.status = Object.keys(STATUS_LABEL).find(k => STATUS_LABEL[k] === v);
        if (r.status === "reading" && !r.started) r.started = today;
        if (r.status === "read" && !r.finished) r.finished = today;
      }
      if (group === "verdict") r.verdict = r.verdict === v ? "" : v;
      if (group === "reread") r.reread = r.reread === v ? "" : v;
      if (group === "gave") r.gave = r.gave.includes(v) ? r.gave.filter(x => x !== v) : [...r.gave, v];
    });
  }

  const kind = t.closest("#noteKind button");
  if (kind) return setKind(kind.dataset.v);

  if (t.closest("#addNote")) {
    const text = $("noteText").value.trim(); if (!text) return;
    const note = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      kind: dlg.querySelector("#noteKind [aria-pressed=true]").dataset.v,
      text, page: $("notePage").value.trim(), at: new Date().toISOString()
    };
    $("noteText").value = ""; $("notePage").value = "";
    return update(id, r => { r.notes = [...r.notes, note]; });
  }

  // Deleting needs two taps: the first arms the button, the second deletes.
  const del = t.closest("[data-del]");
  if (del) {
    if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = "Tap again to delete"; return; }
    return update(id, r => { r.notes = r.notes.filter(n => n.id !== del.dataset.del); });
  }
});
dlg.addEventListener("input", e => {
  if (e.target.id === "noteText") $("addNote").disabled = !e.target.value.trim();
});
dlg.addEventListener("change", e => {
  const id = ui.openId; if (!id) return;
  const b = BOOKS.find(x => x.id === id);
  if (e.target.id === "recStarted") update(id, r => { r.started = e.target.value; });
  if (e.target.id === "recFinished") update(id, r => { r.finished = e.target.value; });
  if (e.target.id === "recGenre") update(id, r => { if (e.target.value === b.genre) delete r.genre; else r.genre = e.target.value; });
});
// A cover image that fails to load falls back to the generated cover underneath.
document.addEventListener("error", e => { if (e.target.tagName === "IMG" && e.target.closest(".cover")) e.target.remove(); }, true);

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function monthName(i) { return new Date(2000, i, 1).toLocaleDateString(undefined, { month: "short" }); }
function fmtDate(iso) {
  try { return new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); }
  catch (e) { return ""; }
}
let toastTimer;
function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 4000);
}

render();
Store.start();
</script>
